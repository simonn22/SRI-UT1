server {
    listen 80;
    server_name www.simon.test simon.test; 
    root /var/www/simontest;
    index index.html;

    location /descargas/ {
        fancyindex on;
        
        fancyindex_exact_size off; # Indico que muestre el tamaño en MB
        fancyindex_localtime on;   # Indico que use la hora del servidor 
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        fastcgi_pass unix:/run/php/php8.5-fpm.sock; 
    }
}
