server {
    listen 80;
    server_name www.simon.test simon.test; 
    access_log /var/log/nginx/simon.access.log;
    error_log  /var/log/nginx/simon.error.log;
    root /var/www/simontest;
    index index.html;

    location /admin/ {
        satisfy any;
        
        allow 80.103.33.127;
        allow 127.0.0.1;
        deny all;
        
        auth_basic "Admin";
        auth_basic_user_file /etc/nginx/.htpasswd_admin;
    }
}
